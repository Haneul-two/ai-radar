ref = CONFIG.ctaHref;\n  const root = document.documentElement.style;\n  if (CONFIG.bgPc) root.setProperty(\"--bg\", \"url(\\\"\" + CONFIG.bgPc + \"\\\")\");\n  if (CONFIG.bgMobile) root.setProperty(\"--bgm\", \"url(\\\"\" + CONFIG.bgMobile + \"\\\")\");\n  // PC: 타이틀·일정 문구 아래로 배경 큐브가 오도록 배경 위치 자동 조정 (원본 1828x1021, 폭 94vw 기준)\n  function fitBg() {\n    const h = $(\"hero\"), w = window.innerWidth;\n    if (w <= 480) { h.style.removeProperty(\"--bgY\"); h.style.removeProperty(\"--extra\"); return; }\n    const d = $(\"date\").getBoundingClientRect().bottom - h.getBoundingClientRect().top;\n    const base = 0.066 * w, y = Math.max(base, d + 0.017 * w - 0.1387 * w);\n    h.style.setProperty(\"--bgY\", y + \"px\");\n    h.style.setProperty(\"--extra\", (y - base) + \"px\");\n  }\n  $(\"title\").addEventListener(\"load\", fitBg);\n  if (document.fonts) document.fonts.ready.then(fitBg);\n  // 배경 이미지 로드 후 페이드 인\n  const bgUrl = (window.matchMedia(\"(max-width:480px)\").matches && CONFIG.bgMobile) ? CONFIG.bgMobile : CONFIG.bgPc;\n  if (bgUrl) { const im = new Image(); im.onload = im.onerror = function () { $(\"bg\").classList.add(\"on\"); }; im.src = bgUrl; if (im.complete) $(\"bg\").classList.add(\"on\"); }\n  else $(\"bg\").classList.add(\"on\");\n  window.addEventListener(\"resize\", fitBg);\n  fitBg();\n<\/script>\n<\/body><\/html>\n"}]}, {"sectionType": "section-code", "settings": [{"key": "section_code", "type": "CODE-EDITOR-HTML", "value": "<!doctype html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{--ink:#fff;--sub:rgba(255,255,255,.82);--red:#e8202f;\n    --font:\"Pretendard\",\"Noto Sans KR\",-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif}\n  *{box-sizing:border-box}\n  html,body{margin:0;overflow:hidden} /* 코드 섹션 안 스크롤바 숨김 */\n  /* 배경 투명 — 섹션 배경이 비침. 카드 바깥에는 그림자를 그리지 않음 */\n  body{background:transparent;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;\n    padding:clamp(10px,1.6vw,24px) clamp(8px,1.4vw,20px)}\n  .grid{max-width:1640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2.3vw,38px)}\n  .card{border-radius:clamp(16px,2.4vw,36px);border:1px solid rgba(255,255,255,.18);\n    background:linear-gradient(135deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 45%,rgba(255,255,255,.04) 100%);\n    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);\n    display:flex;flex-direction:column;align-items:center;text-align:center;\n    padding:clamp(20px,3.1vw,46px) clamp(12px,2vw,30px) clamp(22px,3.6vw,56px)}\n  .icon{width:clamp(28px,3.7vw,56px);height:clamp(28px,3.7vw,56px);color:var(--red)}\n  .icon svg{width:100%;height:100%;display:block}\n  h3{margin:clamp(8px,1.2vw,18px) 0 clamp(14px,2.6vw,38px);font-size:clamp(16px,2.3vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.3}\n  p{margin:0;font-size:clamp(12px,1.8vw,27px);line-height:1.72;color:var(--sub);word-break:keep-all}\n  /* 모바일: 가로형 카드 (아이콘 왼쪽 + 제목·설명 오른쪽) */\n  @media (max-width:480px){\n    body{padding:12px 16px}\n    .grid{grid-template-columns:1fr;gap:14px}\n    .card{flex-direction:row;align-items:flex-start;text-align:left;gap:16px;padding:24px 22px;border-radius:22px}\n    .icon{flex:0 0 auto;width:34px;height:34px;margin-top:2px}\n    .txt{flex:1;min-width:0}\n    h3{margin:0 0 8px;font-size:19px}\n    p{font-size:14px;line-height:1.7}\n  }\n<\/style><\/head><body>\n<div class=\"grid\" id=\"grid\"><\/div>\n<script>\n  // ===== 내용 수정은 여기만 =====\n  // icon: \"person\" | \"calendar\" | \"gift\" | \"trophy\" | \"pin\" | \"doc\"\n  const CARDS = [\n    { icon: \"person\",   title: \"대상\", desc: \"학력·전공 무관,\\nAI 관심있는 누구나\" },\n    { icon: \"calendar\", title: \"기간\", desc: \"예선 | 10월 28일(수)~11월 4일(수)\\n본선 | 11월 24일(화)~11월 25일(수)\" },\n    { icon: \"gift\",     title: \"혜택\", desc: \"총 상금 2천만원,\\n채용 전환형 인턴십\" }\n  ];\n  // =============================\n\n  const S = '<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">';\n  const ICONS = {\n    person: S + '<circle cx=\"24\" cy=\"15\" r=\"9\"/><path d=\"M7 43c1.5-9 8.5-14 17-14s15.5 5 17 14\"/><\/svg>',\n    calendar: S + '<rect x=\"6\" y=\"9\" width=\"36\" height=\"33\" rx=\"2\"/><path d=\"M6 18h36M15 4v9M33 4v9\"/><g fill=\"currentColor\" stroke=\"none\"><circle cx=\"16\" cy=\"25\" r=\"1.7\"/><circle cx=\"24\" cy=\"25\" r=\"1.7\"/><circle cx=\"32\" cy=\"25\" r=\"1.7\"/><circle cx=\"16\" cy=\"33\" r=\"1.7\"/><circle cx=\"24\" cy=\"33\" r=\"1.7\"/><circle cx=\"32\" cy=\"33\" r=\"1.7\"/><\/g><\/svg>',\n    gift: S + '<rect x=\"6\" y=\"16\" width=\"36\" height=\"9\" rx=\"1.5\"/><path d=\"M9 25v17h30V25M24 16v26\"/><path d=\"M24 16c-3-6-12-9-12-3 0 3 4 3 12 3zM24 16c3-6 12-9 12-3 0 3-4 3-12 3z\"/><\/svg>',\n    trophy: S + '<path d=\"M15 6h18v12a9 9 0 0 1-18 0z\"/><path d=\"M15 10H7c0 7 4 10 8 10M33 10h8c0 7-4 10-8 10M24 27v8M16 42h16M18 42c0-4 2-7 6-7s6 3 6 7\"/><\/svg>',\n    pin: S + '<path d=\"M24 43s14-12.5 14-24a14 14 0 0 0-28 0c0 11.5 14 24 14 24z\"/><circle cx=\"24\" cy=\"19\" r=\"5\"/><\/svg>',\n    doc: S + '<path d=\"M12 5h17l9 9v29H12z\"/><path d=\"M29 5v9h9M18 24h14M18 31h14M18 38h9\"/><\/svg>'\n  };\n\n  const grid = document.getElementById(\"grid\");\n  CARDS.forEach((c) => {\n    const card = document.createElement(\"article\");\n    card.className = \"card\";\n    card.innerHTML = '<div class=\"icon\" aria-hidden=\"true\">' + (ICONS[c.icon] || \"\") + '<\/div><div class=\"txt\"><h3><\/h3><p><\/p><\/div>';\n    card.querySelector(\"h3\").textContent = c.title;\n    const p = card.querySelector(\"p\");\n    c.desc.split(\"\\n\").forEach((t, k) => { if (k) p.appendChild(document.createElement(\"br\")); p.appendChild(document.createTextNode(t)); });\n    grid.appendChild(card);\n  });\n<\/script>\n<\/body><\/html>\n"}]}, {"sectionType": "section-code", "settings": [{"key": "section_code", "type": "CODE-EDITOR-HTML", "value": "<!doctype html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{--ink:#fff;--hl:#ff6b78;--red:#e8202f;\n    --font:\"Pretendard\",\"Noto Sans KR\",-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif}\n  *{box-sizing:border-box}\n  html,body{margin:0;overflow:hidden} /* 코드 섹션 안 스크롤바 숨김 */\n  /* 배경 투명 — 섹션 배경이 비침. 카드 바깥에는 그림자를 그리지 않음 */\n  body{background:transparent;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;\n    padding:clamp(10px,1.6vw,24px) clamp(8px,1.2vw,16px)}\n  .card{max-width:1650px;margin:0 auto;border-radius:clamp(18px,2.6vw,40px);border:1px solid rgba(255,255,255,.22);\n    background:radial-gradient(70% 120% at 0% 0%,rgba(110,8,18,.55) 0%,transparent 70%),\n               linear-gradient(180deg,#2c0409 0%,#22030a 55%,#1a0206 100%);\n    display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;\n    padding:clamp(28px,5.4vw,84px) clamp(16px,3vw,48px)}\n  .step{display:flex;flex-direction:column;align-items:center;text-align:center}\n  .pill{display:inline-flex;align-items:center;height:clamp(32px,4.4vw,72px);padding:0 clamp(14px,1.9vw,30px);border-radius:999px;\n    font-size:clamp(13px,1.75vw,28px);font-weight:700;letter-spacing:.01em;margin-bottom:clamp(14px,2.3vw,36px);white-space:nowrap}\n  .pill.base{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.92)}\n  .pill.hot{background:rgba(120,6,18,.55);border:1px solid rgba(232,32,47,.65);color:var(--red)}\n  .step p{margin:0;font-size:clamp(13px,1.95vw,31px);line-height:1.6;font-weight:500;word-break:keep-all}\n  .step p em{font-style:normal;color:var(--hl)}\n  .arrow{width:clamp(48px,7.2vw,116px);margin:0 clamp(8px,2vw,32px)}\n  .arrow svg{display:block;width:100%;height:auto}\n  /* 모바일: 위아래 배치, 화살표는 아래 방향 */\n  @media (max-width:480px){\n    body{padding:12px 16px}\n    .card{grid-template-columns:1fr;row-gap:22px;padding:34px 20px;border-radius:24px}\n    .pill{height:38px;font-size:15px;padding:0 18px;margin-bottom:16px}\n    .step p{font-size:16px}\n    .arrow{width:56px;margin:0 auto;transform:rotate(90deg)}\n  }\n<\/style><\/head><body>\n<div class=\"card\" id=\"card\"><\/div>\n<script>\n  // ===== 내용 수정은 여기만 =====\n  // [[ ]] 로 감싼 부분은 분홍색 강조, 줄바꿈은 \\n. style: \"base\"(회색 배지) | \"hot\"(빨간 배지)\n  const STEPS = [\n    { label: \"STEP 1 : 예선\", style: \"base\",\n      text: \"롯데 현장에서 실제 겪고있는\\n7개의 과제가 제시됩니다.\\n이 중 [[1개의 과제를 선택하여]]\\nAI 기반 해결책을 제시합니다.\" },\n    { label: \"STEP 2 : 본선\", style: \"hot\",\n      text: \"구체화된 예선 과제와\\n현장 데이터가 제시됩니다.\\n문제해결을 위한 [[실제 프로토타입\\nAI 에이전트를 개발]]합니다.\" }\n  ];\n  // =============================\n\n  const ARROW = '<svg viewBox=\"0 0 120 72\" aria-hidden=\"true\"><defs><linearGradient id=\"ag\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">' +\n    '<stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0\"/><stop offset=\".55\" stop-color=\"#fff\" stop-opacity=\".75\"/><stop offset=\"1\" stop-color=\"#fff\"/><\/linearGradient><\/defs>' +\n    '<g fill=\"url(#ag)\"><path d=\"M2 2h22l26 34-26 34H2l26-34z\"/><path d=\"M34 2h22l26 34-26 34H34l26-34z\"/><path d=\"M66 2h22l26 34-26 34H66l26-34z\"/><\/g><\/svg>';\n\n  // 텍스트 → 줄바꿈/강조 반영 (HTML 주입 없이 안전하게 생성)\n  function render(el, text) {\n    let hl = false;\n    text.split(/(\\[\\[|\\]\\]|\\n)/).forEach((t) => {\n      if (t === \"[[\") hl = true;\n      else if (t === \"]]\") hl = false;\n      else if (t === \"\\n\") el.appendChild(document.createElement(\"br\"));\n      else if (t) { const n = hl ? document.createElement(\"em\") : document.createTextNode(t); if (hl) n.textContent = t; el.appendChild(n); }\n    });\n  }\n\n  const card = document.getElementById(\"card\");\n  STEPS.forEach((s, i) => {\n    if (i) { const a = document.createElement(\"div\"); a.className = \"arrow\"; a.innerHTML = ARROW; card.appendChild(a); }\n    const st = document.createElement(\"div\"); st.className = \"step\";\n    const pill = document.createElement(\"span\"); pill.className = \"pill \" + (s.style || \"base\"); pill.textContent = s.label;\n    const p = document.createElement(\"p\"); render(p, s.text);\n    st.append(pill, p); card.appendChild(st);\n  });\n<\/script>\n<\/body><\/html>\n"}]}, {"sectionType": "section-code", "settings": [{"key": "section_code", "type": "CODE-EDITOR-HTML", "value": "<!doctype html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{--ink:#fff;--sub:rgba(255,255,255,.72);--date:rgba(255,255,255,.88);--line:rgba(255,255,255,.22);--dot:#e8202f;\n    --font:\"Pretendard\",\"Noto Sans KR\",-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif}\n  *{box-sizing:border-box}\n  html,body{margin:0}\n  /* 배경 투명 — 섹션 배경이 비침. 큐브가 카드 아래로 튀어나오므로 하단 여백 확보 */\n  body{background:transparent;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;\n    padding:clamp(12px,2vw,28px) clamp(10px,2vw,28px) clamp(40px,6vw,90px)}\n  .wrap{position:relative;max-width:1280px;margin:0 auto}\n  .card{position:relative;border:1px solid rgba(255,255,255,.14);border-radius:clamp(18px,2.6vw,36px);overflow:hidden;\n    background:radial-gradient(60% 70% at 100% 0%,rgba(140,10,22,.38) 0%,transparent 70%),\n               linear-gradient(180deg,#232327 0%,#1c1c20 100%);\n    padding:clamp(28px,5vw,70px) clamp(20px,5vw,66px)}\n  .row{display:grid;grid-template-columns:clamp(150px,27vw,380px) clamp(14px,2.2vw,30px) minmax(0,1fr);column-gap:clamp(10px,1.8vw,22px)}\n  .date{font-size:20px;font-weight:600;color:var(--date);line-height:1.4;padding-top:.15em}\n  .rail{position:relative;display:flex;justify-content:center}\n  .rail::before{content:\"\";width:clamp(7px,.85vw,11px);height:clamp(7px,.85vw,11px);border-radius:50%;background:var(--dot);\n    margin-top:clamp(7px,.95vw,13px);position:relative;z-index:1}\n  .rail::after{content:\"\";position:absolute;top:clamp(20px,2.4vw,34px);bottom:clamp(-4px,-.3vw,-2px);left:50%;width:1px;background:var(--line);transform:translateX(-50%)}\n  .row:last-child .rail::after{display:none}\n  .row:last-child .rail::before{background:#fff}\n  .body{padding-bottom:clamp(26px,4vw,58px)}\n  .row:last-child .body{padding-bottom:0}\n  h3{margin:0 0 clamp(8px,1.2vw,16px);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.3;word-break:keep-all}\n  p{margin:0;font-size:18px;line-height:1.75;color:var(--sub);word-break:keep-all}\n  .cube{position:absolute;right:clamp(-4px,1.8vw,30px);bottom:calc(-1 * clamp(36px,5.4vw,80px));width:clamp(120px,24vw,320px);\n    pointer-events:none;user-select:none}\n  /* 모바일: 날짜를 제목 위로 */\n  @media (max-width:480px){\n    body{padding:12px 16px 56px}\n    .card{padding:30px 22px 120px;border-radius:24px}\n    .row{grid-template-columns:18px minmax(0,1fr);column-gap:14px}\n    .rail{grid-row:1 / span 2;grid-column:1}\n    .rail::before{width:9px;height:9px;margin-top:6px}\n    .rail::after{top:22px;bottom:-6px}\n    .date{grid-column:2;font-size:13px;color:rgba(255,255,255,.6);padding:0;margin-bottom:4px}\n    .body{grid-column:2;padding-bottom:28px}\n    h3{font-size:18px;margin-bottom:8px}p{font-size:14px}\n    .cube{width:150px;right:6px;bottom:-40px}\n  }\n<\/style><\/head><body>\n<div class=\"wrap\">\n  <div class=\"card\" id=\"list\"><\/div>\n  <img class=\"cube\" id=\"cube\" alt=\"\">\n<\/div>\n<script>\n  // ===== 내용 수정은 여기만 =====\n  const STEPS = [\n    { date: \"10월 28일(수)~11월 4일(수)\", title: \"온라인 예선\", desc: \"홈페이지를 통한 온라인 접수\\nAI 문제해결방안 · AI 보유역량 제출\" },\n    { date: \"11월 중\", title: \"결과 발표\", desc: \"온라인 평가 진행\\n본선 진출자 선발\" },\n    { date: \"11월 24일(화)~11월 25일(수)\", title: \"오프라인 본선(1박2일)\", desc: \"실제 프로토타입 AI 에이전트 개발\\n(롯데인재개발원 오산캠퍼스)\" },\n    { date: \"’27년 1월 ~\", title: \"채용\", desc: \"참여사별 인턴십 진행\\n정규직 채용 연계(I’M 전형)\" }\n  ];\n  // 큐브 이미지: 내장 이미지 대신 갤러리 주소(https://...)를 넣어도 됨. 빈 문자열이면 숨김\n  const CUBE = \"\";\n  // =============================\n\n  const list = document.getElementById(\"list\");\n  STEPS.forEach((s) => {\n    const row = document.createElement(\"div\"); row.className = \"row\";\n    row.innerHTML = '<div class=\"date\"><\/div><div class=\"rail\" aria-hidden=\"true\"><\/div><div class=\"body\"><h3><\/h3><p><\/p><\/div>';\n    row.querySelector(\".date\").textContent = s.date;\n    row.querySelector(\"h3\").textContent = s.title;\n    const p = row.querySelector(\"p\");\n    s.desc.split(\"\\n\").forEach((t, k) => { if (k) p.appendChild(document.createElement(\"br\")); p.appendChild(document.createTextNode(t)); });\n    list.appendChild(row);\n  });\n  const cube = document.getElementById(\"cube\");\n  if (CUBE) cube.src = CUBE; else cube.remove();\n<\/script>\n<\/body><\/html>\n"}]}, {"sectionType": "section-code", "settings": [{"key": "section_code", "type": "CODE-EDITOR-HTML", "value": "<!doctype html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{--bg1:#2b0207;--bg2:#160104;--ink:#fff;--sub:rgba(255,255,255,.86);--pink:#ff8d95;\n    --font:\"Pretendard\",\"Noto Sans KR\",-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif}\n  *{box-sizing:border-box}\n  html,body{margin:0}\n  body{position:relative;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;\n    background:transparent; /* 배경 이미지는 섹션 CSS로 지정 */\n    padding:clamp(16px,2.8vw,40px) clamp(10px,2.2vw,32px)}\n  .grid{position:relative;max-width:1384px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2.4vw,36px)}\n  .card{position:relative;min-height:clamp(220px,34.5vw,500px);border-radius:clamp(18px,2.7vw,40px);\n    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\n    padding:clamp(20px,4vw,56px) clamp(14px,3vw,40px);}\n  .card.glass{background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.10) 45%,rgba(255,255,255,.05) 100%);\n    border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}\n  .card.hot{background:linear-gradient(180deg,#3d0711 0%,#5c0716 55%,#7d0019 100%);\n    border:1px solid rgba(255,150,160,.75);box-shadow:none}\n  .badge{display:inline-flex;align-items:center;height:clamp(28px,4.3vw,62px);padding:0 clamp(14px,1.9vw,28px);border-radius:999px;\n    font-size:clamp(11px,1.45vw,21px);font-weight:600;letter-spacing:.01em;margin-bottom:clamp(14px,2.4vw,34px)}\n  .glass .badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25)}\n  .hot .badge{background:rgba(160,10,30,.55);border:1px solid rgba(255,150,160,.45)}\n  .kicker{margin:0;font-size:clamp(12px,1.6vw,23px);font-weight:600}\n  .big{margin:clamp(2px,.5vw,8px) 0 clamp(6px,1vw,14px);font-size:clamp(34px,5.6vw,80px);font-weight:700;line-height:1.12;letter-spacing:-.02em;word-break:keep-all}\n  .hot .big{color:var(--pink);font-size:clamp(26px,4.4vw,64px);line-height:1.25}\n  .desc{margin:0;font-size:clamp(11px,1.6vw,23px);line-height:1.5;color:var(--sub);word-break:keep-all}\n  @media (max-width:480px){\n    .grid{grid-template-columns:1fr;gap:16px}\n    .card{min-height:0;padding:32px 20px;border-radius:24px}\n    .badge{height:34px;font-size:14px;padding:0 16px;margin-bottom:16px}\n    .kicker{font-size:15px}.big{font-size:44px}.hot .big{font-size:34px}.desc{font-size:15px}\n  }\n<\/style><\/head><body>\n<div class=\"grid\" id=\"grid\"><\/div>\n<script>\n  // ===== 내용 수정은 여기만 =====\n  // style: \"glass\"(반투명) | \"hot\"(강조 붉은 카드). kicker는 비워도 됨. 줄바꿈은 \\n\n  const CARDS = [\n    { style: \"glass\", badge: \"BENEFIT 01\", kicker: \"총 상금\", big: \"2천만원+\", desc: \"수상자에게\\n총 상금 2천만원+ 수여\" },\n    { style: \"hot\",   badge: \"BENEFIT 02\", kicker: \"\", big: \"채용 전환형\\n인턴십 제공\", desc: \"각 참여사별 채용 전환형 인턴십 제공\\n(I'M 전형 연계, 2027년 입사 가능자)\" }\n  ];\n  // =============================\n  const lines = (el, text) => text.split(\"\\n\").forEach((t, i) => { if (i) el.appendChild(document.createElement(\"br\")); el.appendChild(document.createTextNode(t)); });\n  const grid = document.getElementById(\"grid\");\n  CARDS.forEach((c) => {\n    const card = document.createElement(\"article\"); card.className = \"card \" + c.style;\n    const b = document.createElement(\"span\"); b.className = \"badge\"; b.textContent = c.badge; card.appendChild(b);\n    if (c.kicker) { const k = document.createElement(\"p\"); k.className = \"kicker\"; k.textContent = c.kicker; card.appendChild(k); }\n    const g = document.createElement(\"h3\"); g.className = \"big\"; lines(g, c.big); card.appendChild(g);\n    const d = document.createElement(\"p\"); d.className = \"desc\"; lines(d, c.desc); card.appendChild(d);\n    grid.appendChild(card);\n  });\n<\/script>\n<\/body><\/html>\n"}]}, {"sectionType": "section-code", "settings": [{"key": "section_code", "type": "CODE-EDITOR-HTML", "value": "<!doctype html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{--bg:#121216;--line:rgba(255,255,255,.12);--ink:#fff;--sub:#b5b5bb;--accent:#ed1c24;\n    --font:\"Pretendard\",\"Noto Sans KR\",-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif}\n  *{box-sizing:border-box}\n  html,body{margin:0;background:transparent;overflow:hidden}\n  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;padding:clamp(12px,1.7vw,24px) clamp(8px,1.2vw,16px)}\n  /* 좌우 배치: iframe 폭에 비례해 글자·여백이 줄어듦 (vw = 코드 섹션 폭 기준) */\n  .card{position:relative;max-width:1352px;margin:0 auto;border:1px solid var(--line);border-radius:clamp(18px,2.6vw,36px);overflow:hidden;\n    background:linear-gradient(180deg,#232327 0%,#1b1b1f 100%);\n    display:grid;grid-template-columns:minmax(0,1.45fr) 1px minmax(0,1fr);padding:clamp(24px,4vw,56px) 0}\n  .info{margin:0;padding:8px clamp(16px,4.4vw,64px) 8px clamp(18px,6.6vw,96px);display:grid;grid-template-columns:auto 1fr;\n    column-gap:clamp(12px,4.8vw,70px);row-gap:clamp(10px,2.4vw,34px);align-content:center}\n  .info dt{font-size:20px;font-weight:700;line-height:1.5;white-space:nowrap}\n  .info dd{margin:0;font-size:20px;line-height:1.5;color:var(--sub);word-break:keep-all}\n  .divider{background:var(--line);margin:8px 0}\n  .side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px clamp(14px,4.4vw,64px)}\n  .side canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}\n  .label{position:relative;font-size:clamp(12px,1.6vw,23px);font-weight:600;margin:0}\n  .dday{position:relative;font-size:clamp(40px,6.7vw,96px);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--accent);\n    margin:clamp(10px,1.8vw,26px) 0 clamp(12px,2.1vw,30px);text-shadow:0 0 40px rgba(237,28,36,.25)}\n  .msg{position:relative;font-size:clamp(11px,1.4vw,20px);line-height:1.6;color:var(--sub);margin:0 0 clamp(14px,2.4vw,34px);word-break:keep-all}\n  .cta{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:420px;height:clamp(40px,5.7vw,82px);border-radius:999px;\n    background:var(--accent);color:#fff;font-size:clamp(14px,1.8vw,26px);font-weight:700;text-decoration:none;transition:transform .15s,filter .15s}\n  .cta:hover{filter:brightness(1.08);transform:translateY(-1px)}\n  .cta:focus-visible{outline:3px solid #fff;outline-offset:3px}\n  /* 아주 좁은 화면(휴대폰)에서만 위아래 배치 */\n  @media (max-width:480px){\n    .card{grid-template-columns:1fr;padding:32px 0;border-radius:24px}\n    .divider{height:1px;margin:28px 22px}\n    .info{padding:0 22px;column-gap:20px;row-gap:16px}\n    .info dt,.info dd{font-size:14px}.label{font-size:15px}\n    .side{padding:0 22px}\n    .dday{font-size:60px;margin:14px 0 16px}.msg{font-size:14px;margin-bottom:20px}\n    .cta{height:52px;font-size:17px}\n  }\n<\/style><\/head><body>\n<section class=\"card\" aria-label=\"모집 개요\">\n  <dl class=\"info\" id=\"info\"><\/dl>\n  <div class=\"divider\" aria-hidden=\"true\"><\/div>\n  <div class=\"side\">\n    <canvas id=\"dust\" aria-hidden=\"true\"><\/canvas>\n    <p class=\"label\" id=\"label\"><\/p>\n    <p class=\"dday\" id=\"dday\"><\/p>\n    <p class=\"msg\" id=\"msg\"><\/p>\n    <a class=\"cta\" id=\"cta\" target=\"_top\"><\/a>\n  <\/div>\n<\/section>\n<script>\n  // ===== 내용 수정은 여기만 =====\n  const CONFIG = {\n    items: [\n      [\"대상\", \"AI에 관심 있는 누구나 (학력·전공 무관)\"],\n      [\"예선\", \"[온라인] AI 문제해결방안 · AI 보유역량 제출\"],\n      [\"본선\", \"[오프라인] 롯데인재개발원 오산 캠퍼스,\\n1박 2일 (예선 통과자)\"],\n      [\"주제\", \"롯데 계열사 실제 현업 과제·데이터 기반\\nAI 에이전트 개발\"],\n      [\"혜택\", \"상금 수여, 채용 전환형 인턴십 연계\"]\n    ],\n    label: \"예선 마감까지\",\n    deadline: \"2026-11-04T23:59:59+09:00\",   // 마감일시 — D-day 자동 계산\n    afterDeadline: \"마감\",                     // 마감 후 표시\n    message: \"롯데와 함께 AI의 새로운\\n가능성을 펼쳐보세요\",\n    ctaText: \"참가 신청하기\",\n    ctaHref: \"/jobs/RC20261015037730\"                           // 신청 링크 (사이트 내부 경로 또는 https://...)\n  };\n  // =============================\n\n  const $ = (id) => document.getElementById(id);\n  const info = $(\"info\");\n  CONFIG.items.forEach(([k, v]) => {\n    const dt = document.createElement(\"dt\"); dt.textContent = k;\n    const dd = document.createElement(\"dd\");\n    v.split(\"\\n\").forEach((line, i) => { if (i) dd.appendChild(document.createElement(\"br\")); dd.appendChild(document.createTextNode(line)); });\n    info.append(dt, dd);\n  });\n  $(\"label\").textContent = CONFIG.label;\n  const msg = $(\"msg\");\n  CONFIG.message.split(\"\\n\").forEach((line, i) => { if (i) msg.appendChild(document.createElement(\"br\")); msg.appendChild(document.createTextNode(line)); });\n  $(\"cta\").textContent = CONFIG.ctaText;\n  $(\"cta\").href = CONFIG.ctaHref;\n\n  function updateDday() {\n    const KST = 9 * 3600e3, day = 864e5;\n    const end = new Date(CONFIG.deadline).getTime();\n    const today = Math.floor((Date.now() + KST) / day);\n    const endDay = Math.floor((end + KST) / day);\n    const diff = endDay - today;\n    $(\"dday\").textContent = Date.now() > end ? CONFIG.afterDeadline : diff === 0 ? \"D-DAY\" : \"D-\" + diff;\n  }\n  updateDday(); setInterval(updateDday, 60e3);\n\n  // 배경 붉은 점(먼지) 효과\n  const cv = $(\"dust\"), ctx = cv.getContext(\"2d\");\n  let dots = [], W = 0, H = 0;\n  function resize() {\n    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;\n    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    dots = Array.from({ length: Math.round(W * H / 9000) }, () => ({\n      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + .6,\n      a: Math.random() * .6 + .15, vy: -(Math.random() * .15 + .03), tw: Math.random() * Math.PI * 2 }));\n  }\n  const still = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  function draw() {\n    ctx.clearRect(0, 0, W, H);\n    for (const d of dots) {\n      d.tw += .02; if (!still) { d.y += d.vy; if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; } }\n      ctx.globalAlpha = d.a * (.6 + .4 * Math.sin(d.tw));\n      ctx.fillStyle = \"#ed1c24\"; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();\n    }\n    if (!still) requestAnimationFrame(draw);\n  }\n  addEventListener(\"resize\", resize); resize(); draw();\n<\/script>\n<\/body><\/html>\n"}]}]}]}}}}}}, "page": "/"}</script></body></html>
